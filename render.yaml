# Render Blueprint - deploys the Odyssey backend (FastAPI + LangGraph).
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo -> Apply,
# then set GROQ_API_KEY (marked sync:false, so Render prompts for it).
#
# Runs in ODYSSEY_MODE=local: SQLite checkpointer + in-process store and event bus,
# so no Postgres/Redis/Qdrant are needed. That keeps the whole demo on free tier.
# Note: the free plan's disk is ephemeral and the service sleeps when idle, so
# conversations reset on restart and the first request after a nap is slow.

services:
  - type: web
    name: odyssey-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -e ".[auth]"
    startCommand: uvicorn odyssey.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ODYSSEY_MODE
        value: local
      - key: ODYSSEY_ENV
        value: production
      - key: ODYSSEY_LOG_JSON
        value: "true"
      # Vectors/knowledge base are optional; off keeps the free instance light.
      - key: VECTOR_BACKEND
        value: none
      # LLM: swap provider/model here without touching code.
      - key: ODYSSEY_LLM_PROVIDER
        value: groq
      - key: ODYSSEY_LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      # Browser origins allowed to call this API (the GitHub Pages site + local dev).
      - key: CORS_ORIGINS
        value: https://yuvraj0208.github.io,http://localhost:3000
      - key: JWT_SECRET
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
