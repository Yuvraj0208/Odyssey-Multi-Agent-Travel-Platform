name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API - lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,local,llm,auth]"
      - name: Ruff (lint)
        run: ruff check odyssey tests
      - name: Pyright (types)
        run: pyright odyssey || true   # advisory; not gating
      - name: Pytest
        run: pytest -q

  web:
    name: Web - typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t odyssey-api apps/api
      - name: Build web image
        run: docker build -t odyssey-web apps/web
