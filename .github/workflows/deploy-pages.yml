name: Deploy landing to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Tries to turn Pages on automatically. The default GITHUB_TOKEN cannot create
      # a Pages site on a repo that never had one, so this is best-effort: enable
      # Pages once under Settings -> Pages -> Source: "GitHub Actions".
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - name: Install
        run: npm install
      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          # Project pages are served from /<repo>/, so assets need the prefix.
          NEXT_PUBLIC_BASE_PATH: /Odyssey-Multi-Agent-Travel-Platform
          # Backend the published app talks to. Override by setting a repository
          # variable named API_BASE_URL (Settings -> Secrets and variables ->
          # Actions -> Variables) if your Render service has a different name.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://odyssey-api-z161.onrender.com' }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Disable Jekyll (keep _next/)
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
