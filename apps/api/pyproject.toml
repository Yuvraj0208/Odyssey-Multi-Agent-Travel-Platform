[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odyssey-api"
version = "0.1.0"
description = "Odyssey - agentic AI travel platform backend (LangGraph multi-agent core)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core dependencies: enough to boot the API and run the multi-agent graph in
# local mode (SQLite checkpointer, Groq LLM, real open tourism tools).
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  "orjson>=3.10",
  "tenacity>=9.0",
  "prometheus-client>=0.21",
  "python-multipart>=0.0.12",
  # LangGraph multi-agent core
  "langgraph>=0.2.50",
  "langchain-core>=0.3.20",
  "langchain-groq>=0.2.1",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
# Full stack (Postgres/Qdrant/Redis/Langfuse). Installed inside the Docker image.
stack = [
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "langgraph-checkpoint-postgres>=2.0.0",
  "langchain-qdrant>=0.2",
  "qdrant-client>=1.12",
  "redis>=5.2",
  "langfuse>=2.53",
]
# Local vector store + embeddings (CPU, low memory).
local = [
  "langchain-chroma>=0.1.4",
  "chromadb>=0.5.20",
  "fastembed>=0.4",
]
# Alternate LLM providers.
llm = [
  "langchain-ollama>=0.2",
  "langchain-openai>=0.2",
]
auth = [
  "pyjwt>=2.10",
  "bcrypt>=4.2",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
  "pyright>=1.1.390",
]

[tool.hatch.build.targets.wheel]
packages = ["odyssey"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# E501: long lines OK; B008: FastAPI's Depends()/Header() defaults are idiomatic.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["odyssey"]
reportMissingImports = false
