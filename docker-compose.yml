# Odyssey full stack. One command: docker compose up
# Brings up postgres, redis, qdrant, langfuse, the FastAPI api, and the Next.js web app.
# For low-resource local dev without Docker, use ODYSSEY_MODE=local and `make dev` instead.

name: odyssey

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: odyssey
      POSTGRES_PASSWORD: odyssey
      POSTGRES_DB: odyssey
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odyssey -d odyssey"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Langfuse v2 (self-hosted tracing). Uses its own postgres db on the shared server.
  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://odyssey:odyssey@postgres:5432/odyssey
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: langfuse-dev-secret-change-me
      SALT: langfuse-dev-salt-change-me
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-odyssey-dev
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-odyssey-dev

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      ODYSSEY_MODE: stack
      ODYSSEY_ENV: dev
      DATABASE_URL: postgresql+psycopg://odyssey:odyssey@postgres:5432/odyssey
      REDIS_URL: redis://redis:6379/0
      VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      ODYSSEY_LLM_PROVIDER: ${ODYSSEY_LLM_PROVIDER:-groq}
      ODYSSEY_LLM_MODEL: ${ODYSSEY_LLM_MODEL:-llama-3.3-70b-versatile}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-true}
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: pk-lf-odyssey-dev
      LANGFUSE_SECRET_KEY: sk-lf-odyssey-dev
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-32-chars-min}
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty
    ports:
      - "3000:3000"

volumes:
  pg_data:
  redis_data:
  qdrant_data:
